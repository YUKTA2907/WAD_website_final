<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Hexagonal Chip Body -->
  <rect x="6" y="6" width="88" height="88" rx="16" fill="#070b14" stroke="url(#cyberGrad)" stroke-width="3" />
  
  <!-- Corner Circuit Pins -->
  <line x1="2" y1="25" x2="6" y2="25" stroke="#00f0ff" stroke-width="2" />
  <line x1="2" y1="50" x2="6" y2="50" stroke="#00f0ff" stroke-width="2" />
  <line x1="2" y1="75" x2="6" y2="75" stroke="#00f0ff" stroke-width="2" />
  
  <line x1="94" y1="25" x2="98" y2="25" stroke="#8b5cf6" stroke-width="2" />
  <line x1="94" y1="50" x2="98" y2="50" stroke="#8b5cf6" stroke-width="2" />
  <line x1="94" y1="75" x2="98" y2="75" stroke="#8b5cf6" stroke-width="2" />
  
  <!-- Circuit Nodes -->
  <circle cx="20" cy="20" r="3" fill="#00f0ff" />
  <line x1="20" y1="20" x2="30" y2="30" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 2" />
  <circle cx="80" cy="80" r="3" fill="#8b5cf6" />
  <line x1="80" y1="80" x2="70" y2="70" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Monogram MV Geometric Typography -->
  <path d="M26 68 L26 34 L38 52 L50 34 L50 68" fill="none" stroke="url(#cyberGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M54 34 L65 68 L76 34" fill="none" stroke="url(#cyberGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Central Pulse Dot -->
  <circle cx="65" cy="54" r="2.5" fill="#00f0ff" />
</svg>